# Site Settings
title                    : "Chengyin Li"
description              : "Researcher in AI for medical imaging, focusing on segmentation, adaptive radiotherapy, and foundation models. Department of Radiation Oncology, Henry Ford Health."
url                      : "https://chengyinlee.github.io"
repository               : "ChengyinLee/chengyinlee.github.io"
lang                     : "en"
google_scholar_stats_use_cdn : false
# google_analytics_id    : "G-XXXXXXX"   # add your GA4 ID to enable analytics

# Site Author / profile
author:
  name             : "Chengyin Li"
  name_cn          : ""
  title            : "AI Researcher in Medical Imaging, Adaptive Radiotherapy, and Foundation Models"
  affiliation      : "Department of Radiation Oncology, Henry Ford Health"
  location         : "Detroit, MI, USA"
  avatar           : "/images/chengyin_web.png"
  blurb            : "My research develops deep-learning methods for medical image analysis, focusing on 3D CT/MR segmentation, adaptive radiotherapy, and medical foundation models."
  email            : "cli6@hfhs.org"
  googlescholar    : "https://scholar.google.com/citations?user=GeL7DtsAAAAJ&hl=en"
  github           : "ChengyinLee"
  linkedin         : "chengyin-li-a4262862"
  dblp             : "https://dblp.org/pid/262/6036.html"
  orcid            :   # add your ORCID iD URL here to show the link
  cv               : "/chengyin_cv.pdf"

# Headline metrics (Google Scholar, June 2026). `citations` auto-updates
# if the optional Scholar-crawler GitHub Action is enabled (see README).
metrics:
  show             : true    # collapsible metrics band (set false to remove entirely)
  citations        : 599
  hindex           : 10
  i10index         : 12
  publications     : "20+"
  updated          : "June 2026"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: America/Detroit

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
